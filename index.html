<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f2">
  <title>탐구온 | 수행평가 일정 관리</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-mark">ON</div>
    <div><h1>탐구온</h1><p>수행평가, 놓치지 않게 한곳에</p></div>
    <span id="connection-status" class="status">연결 확인 중</span>
  </header>
  <main class="wrap">
    <section id="auth-panel" class="panel auth-panel">
      <div>
        <p class="eyebrow">TAMGU ON</p>
        <h2>나의 수행평가를 한눈에</h2>
        <p class="muted">이메일로 가입하거나 로그인하면 일정이 계정에 저장돼.</p>
      </div>
      <form id="auth-form">
        <label for="email">이메일</label>
        <input id="email" type="email" autocomplete="email" placeholder="이메일 주소" required>
        <label for="password">비밀번호 (8자 이상)</label>
        <input id="password" type="password" autocomplete="current-password" minlength="8" placeholder="비밀번호" required>
        <div class="actions">
          <button type="button" id="signup" class="secondary">회원가입</button>
          <button type="submit" id="login">로그인</button>
        </div>
        <p id="auth-message" class="message" role="status"></p>
      </form>
    </section>

    <section id="app-panel" class="hidden">
      <div class="welcome panel">
        <div><p class="eyebrow">MY TAMGU ON</p><h2>수행평가 일정</h2><p id="signed-in-as" class="muted"></p></div>
        <button id="logout" class="secondary" type="button">로그아웃</button>
      </div>
      <div class="layout">
        <section class="panel">
          <h3>과제 추가</h3>
          <form id="task-form">
            <label for="subject">과목</label><input id="subject" placeholder="예: 한국지리" required>
            <label for="title">수행평가 이름</label><input id="title" placeholder="예: 지역 조사 보고서" required>
            <label for="due">제출일</label><input id="due" type="date" required>
            <label for="notes">메모 (선택)</label><textarea id="notes" rows="3" placeholder="준비물, 평가 기준 등"></textarea>
            <button type="submit" id="save-task">과제 저장</button>
            <p id="task-message" class="message" role="status"></p>
          </form>
        </section>
        <section class="panel">
          <div class="section-heading"><h3>등록한 과제</h3><button id="refresh" class="secondary" type="button">새로고침</button></div>
          <div id="task-list" class="task-list"><p class="muted">로그인하면 과제가 표시돼.</p></div>
        </section>
      </div>
    </section>
    <section class="notice">
      <strong>처음 사용한다면</strong>
      <p>회원가입 후 인증 메일이 오지 않거나 버튼이 반응하지 않으면 설정을 확인해야 해. 이 앱은 Supabase 연결이 필요해.</p>
    </section>
  </main>
  <footer>탐구온 · 학생용 수행평가 일정 도우미</footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
